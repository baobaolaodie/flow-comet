<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="516" viewBox="0 0 1200 516" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">How the flow-kit 9 stages map onto the 8 engine nodes</title>
  <desc id="wf-desc">Nine flow-kit stages on the left, the engine's eight nodes on the right. CHANGE and REQUIREMENT merge into open; TEST and REVIEW merge into review; DEV runs as execute or subagent-execute depending on the execution mode; DESIGN optionally includes the 2a UI-DESIGN stage for frontend changes. Every arrow carries a gate mark, because every node exit is validated.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>
  <style>
    @keyframes fc-in { from { opacity: 0 } to { opacity: 1 } }
    @keyframes fc-gate { from { opacity: 0; transform: scaleY(0) } to { opacity: 1; transform: scaleY(1) } }
    @keyframes fc-node { from { opacity: .15 } to { opacity: 1 } }
    @keyframes fc-out { from { opacity: 1 } to { opacity: 0 } }
    .a-stage, .a-gate, .a-node {
      animation-duration: .55s, 0.30s;
      animation-timing-function: cubic-bezier(.22,.61,.36,1), linear;
      animation-fill-mode: both, forwards;
      animation-play-state: paused, paused;
      animation-delay: calc(var(--t, 0s) + var(--d, 0s)), calc(var(--t, 0s) + 4.40s);
      animation-iteration-count: 1, 1;
    }
    .a-stage, .a-gate, .a-node { will-change: opacity, transform; backface-visibility: hidden }
    .a-stage { animation-name: fc-in, fc-out }
    .a-gate  { animation-name: fc-gate, fc-out; transform-origin: 450px 0; transform-box: view-box }
    .a-node  { animation-name: fc-node, fc-out }
  </style>


  <rect width="1200" height="516" rx="22" fill="#0B1016"/>

  <text class="mono" x="56" y="64" font-size="18" letter-spacing="1.8" fill="#8B98A8">HOW THE 9 STAGES MAP ONTO THE 8 NODES</text>
  <line x1="56" y1="84" x2="1144" y2="84" stroke="#243040" stroke-width="1.5"/>

  <text class="mono" x="160" y="116" font-size="18" letter-spacing="1.6" fill="#4CAF50">FLOW-KIT STAGES</text>
  <text class="mono" x="540" y="116" font-size="18" letter-spacing="1.6" fill="#4CAF50">ENGINE NODES</text>

  <!-- stage labels -->
  <g class="mono" font-size="20" fill="#E6EDF3">
    <text class="a-stage" style="--d:0.000s" x="160" y="146">CHANGE</text>
    <text class="a-stage" style="--d:0.080s" x="160" y="180">REQUIREMENT</text>
    <text class="a-stage" style="--d:0.160s" x="160" y="214">DESIGN *</text>
    <text class="a-stage" style="--d:0.240s" x="160" y="248">TASK</text>
    <text class="a-stage" style="--d:0.320s" x="160" y="282">DEV</text>
    <text class="a-stage" style="--d:0.400s" x="160" y="316">TEST</text>
    <text class="a-stage" style="--d:0.480s" x="160" y="350">REVIEW</text>
    <text class="a-stage" style="--d:0.560s" x="160" y="384">INTEGRATION</text>
    <text class="a-stage" style="--d:0.640s" x="160" y="418">ARCHIVE</text>
  </g>

  <!-- node labels -->
  <g class="mono" font-size="20" fill="#4CAF50">
    <text class="a-node" style="--d:1.400s" x="540" y="169">open</text>
    <text class="a-node" style="--d:1.480s" x="540" y="220">design</text>
    <text class="a-node" style="--d:1.560s" x="540" y="254">plan</text>
    <text class="a-node" style="--d:1.640s" x="540" y="288">execute ⇄ subagent-execute</text>
    <text class="a-node" style="--d:1.720s" x="540" y="339">review</text>
    <text class="a-node" style="--d:1.800s" x="540" y="390">verify</text>
    <text class="a-node" style="--d:1.880s" x="540" y="424">archive</text>
  </g>

  <!-- connectors: straight stage → node -->
  <g stroke="#243040" stroke-width="2" fill="none">
    <path d="M400 208 H500"/>
    <path d="M400 242 H500"/>
    <path d="M400 270 H500"/>
    <path d="M400 378 H500"/>
    <path d="M400 412 H500"/>
  </g>
  <g fill="#243040">
    <path d="M500 203 L510 208 L500 213 Z"/>
    <path d="M500 237 L510 242 L500 247 Z"/>
    <path d="M500 265 L510 270 L500 275 Z"/>
    <path d="M500 373 L510 378 L500 383 Z"/>
    <path d="M500 407 L510 412 L500 417 Z"/>
  </g>

  <!-- connectors: two stages merge into one node -->
  <g stroke="#243040" stroke-width="2" fill="none">
    <path d="M400 140 H440 V174 H400"/>
    <path d="M440 157 H500"/>
    <path d="M400 310 H440 V344 H400"/>
    <path d="M440 327 H500"/>
  </g>
  <g fill="#243040">
    <path d="M500 152 L510 157 L500 162 Z"/>
    <path d="M500 322 L510 327 L500 332 Z"/>
  </g>

  <!-- gate marks on every transition -->
  <g stroke="#2E6B33" stroke-width="2">
    <line class="a-gate" style="--d:0.600s" x1="450" y1="129" x2="450" y2="143"/>
    <line class="a-gate" style="--d:0.680s" x1="450" y1="163" x2="450" y2="177"/>
    <line class="a-gate" style="--d:0.760s" x1="450" y1="197" x2="450" y2="211"/>
    <line class="a-gate" style="--d:0.840s" x1="450" y1="231" x2="450" y2="245"/>
    <line class="a-gate" style="--d:0.920s" x1="450" y1="259" x2="450" y2="273"/>
    <line class="a-gate" style="--d:1.000s" x1="450" y1="299" x2="450" y2="313"/>
    <line class="a-gate" style="--d:1.080s" x1="450" y1="333" x2="450" y2="347"/>
    <line class="a-gate" style="--d:1.160s" x1="450" y1="367" x2="450" y2="381"/>
    <line class="a-gate" style="--d:1.240s" x1="450" y1="401" x2="450" y2="415"/>
  </g>

  <!-- legend -->
  <line x1="960" y1="150" x2="960" y2="170" stroke="#2E6B33" stroke-width="2"/>
  <text class="sans" x="984" y="158" font-size="18" fill="#8B98A8">a gate: the exit</text>
  <text class="sans" x="984" y="182" font-size="18" fill="#8B98A8">is validated</text>

  <text class="sans" x="960" y="240" font-size="18" fill="#8B98A8">Merge = two stages</text>
  <text class="sans" x="960" y="264" font-size="18" fill="#8B98A8">covered by one node</text>

  <text class="sans" x="960" y="322" font-size="18" fill="#8B98A8">⇄ = chosen by the</text>
  <text class="sans" x="960" y="346" font-size="18" fill="#8B98A8">execution mode</text>

  <line x1="56" y1="438" x2="1144" y2="438" stroke="#243040" stroke-width="1.5"/>
  <text class="sans" x="56" y="464" font-size="18" fill="#8B98A8">* 2a UI-DESIGN applies to frontend changes only, and is skipped explicitly otherwise.</text>
  <text class="sans" x="56" y="488" font-size="18" fill="#8B98A8">Every node's exit is validated by the guard, and the verify exit runs the test commands.</text>
</svg>
