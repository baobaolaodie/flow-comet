<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="rp-title rp-desc">
  <title id="rp-title">How flow-comet relates to the projects it is compared with</title>
  <desc id="rp-desc">Five projects named by flow-kit itself as its sources sit in an aggregation layer and feed flow-kit, which flow-comet depends on and inherits artifacts and rules from. comet is a dashed early mechanism reference that is now decoupled, and brooks-lint is a dashed optional integration.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="430" rx="22" fill="#0B1016"/>

  <!-- aggregation layer -->
  <rect x="48" y="36" width="1104" height="118" rx="14" fill="#101720" stroke="#243040" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="mono" x="72" y="62" font-size="17" letter-spacing="1.4" fill="#8B98A8">AGGREGATION LAYER · SOURCES NAMED BY FLOW-KIT ITSELF</text>

  <g fill="#141B24" stroke="#243040" stroke-width="1.5">
    <rect x="72" y="72" width="190" height="64" rx="10"/>
    <rect x="282" y="72" width="190" height="64" rx="10"/>
    <rect x="492" y="72" width="190" height="64" rx="10"/>
    <rect x="702" y="72" width="190" height="64" rx="10"/>
    <rect x="922" y="72" width="206" height="64" rx="10"/>
  </g>
  <g class="mono" font-size="20" fill="#E6EDF3">
    <text x="94" y="102">spec-kit</text>
    <text x="304" y="102">OpenSpec</text>
    <text x="514" y="102">GSD</text>
    <text x="724" y="102">Taskmaster</text>
    <text x="944" y="102">Superpowers</text>
  </g>
  <g class="sans" font-size="17" fill="#8B98A8">
    <text x="94" y="126">task block</text>
    <text x="304" y="126">spec first</text>
    <text x="514" y="126">fresh context</text>
    <text x="724" y="126">task layer</text>
    <text x="944" y="126">skill rules</text>
  </g>

  <!-- collector -->
  <g stroke="#243040" stroke-width="2" fill="none">
    <path d="M167 136 V170"/>
    <path d="M377 136 V170"/>
    <path d="M587 136 V170"/>
    <path d="M797 136 V170"/>
    <path d="M1025 136 V170"/>
    <path d="M167 170 H1025"/>
    <path d="M600 170 V196"/>
  </g>
  <path d="M595 196 L600 206 L605 196 Z" fill="#243040"/>

  <!-- flow-kit -->
  <rect x="450" y="206" width="300" height="80" rx="12" fill="#141B24" stroke="#4CAF50" stroke-width="2"/>
  <text class="mono" x="474" y="240" font-size="22" fill="#E6EDF3">flow-kit</text>
  <text class="sans" x="474" y="268" font-size="18" fill="#8B98A8">9 stages · zero runtime</text>

  <!-- dependency arrow -->
  <line x1="600" y1="286" x2="600" y2="326" stroke="#4CAF50" stroke-width="2"/>
  <line x1="592" y1="300" x2="608" y2="300" stroke="#4CAF50" stroke-width="2"/>
  <path d="M595 326 L600 336 L605 326 Z" fill="#4CAF50"/>
  <text class="sans" x="620" y="314" font-size="18" fill="#8B98A8">dependency: pinned at install</text>

  <!-- flow-comet -->
  <rect x="450" y="336" width="300" height="76" rx="12" fill="#141B24" stroke="#4CAF50" stroke-width="2"/>
  <text class="mono" x="474" y="370" font-size="22" fill="#E6EDF3">flow-comet</text>
  <text class="sans" x="474" y="396" font-size="18" fill="#8B98A8">8-node engine · every exit a gate</text>

  <!-- comet (dashed) -->
  <rect x="60" y="342" width="220" height="68" rx="12" fill="#101720" stroke="#243040" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="mono" x="82" y="374" font-size="20" fill="#E6EDF3">comet</text>
  <text class="sans" x="82" y="397" font-size="17" fill="#8B98A8">early reference</text>
  <path d="M280 376 C350 376 380 374 446 374" stroke="#243040" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
  <path d="M446 369 L456 374 L446 379 Z" fill="#243040"/>

  <!-- brooks-lint (dashed) -->
  <rect x="920" y="342" width="220" height="68" rx="12" fill="#101720" stroke="#243040" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="mono" x="942" y="374" font-size="20" fill="#E6EDF3">brooks-lint</text>
  <text class="sans" x="942" y="397" font-size="17" fill="#8B98A8">optional integration</text>
  <path d="M920 376 C850 376 820 374 754 374" stroke="#243040" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
  <path d="M754 369 L744 374 L754 379 Z" fill="#243040"/>

  <text class="sans" x="60" y="428" font-size="16" fill="#8B98A8">solid = documented relationship · dashed = historical reference or optional integration</text>
</svg>
