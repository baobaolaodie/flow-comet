# 新贡献者欢迎 / First-interaction greeting (2026-08-10)
# 外部协作者无需额外文档时的引导:
# 欢迎消息给出 PR 规范提示 + 本地预检指引(回归命令),其余由 CI 服务端强制。
name: greeting

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write
  contents: read

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: |-
            👋 感谢你的首个 PR / Thanks for your first PR to flow-comet!

            Before review, please make sure:
            - PR title follows Conventional Commits (e.g. `fix: ...`, `docs: ...`, `ci: ...`)
            - The checklist in the PR template stays complete (keep unchecked items as `[ ]`)
            - Local pre-check: `node .comet/bundle-drafts/flow-comet/skills/flow-comet/scripts/guard-self-test.mjs` → ALL 208 SCENARIOS PASSED

            CI enforces the rest automatically (regression, PR conventions, version consistency, dead links). Local hooks: run `node scripts/install-commit-hook.mjs` after cloning.
