# flow-comet CI — 仓库约定机械化 / automated enforcement of repository conventions (2026-08-10)
#
# 设计 / Design: CI 检查在本工作流中独立实现(服务端权威——贡献者无法通过修改仓库文件削弱检查)。
# (All checks are enforced server-side and independently.)
#
# 检查映射 / Check mapping:
#   regression           guard self-test (309 scenarios incl. scenario-count & public-artifact
#                        code self-checks) / script syntax / BOM guard
#   installer            prepare-env reproducibility + distribution surface (publishable
#                        manifest / pack boundary incl. top-level allowlist and per-file
#                        skill tree / bin contract) + installed-copy smoke test
#   quality              workflow yaml validity (actionlint) + bilingual mirror symmetry
#   pr-policy            PR template completeness (5 bilingual sections + 17 checkboxes,
#                        deletion = fail) / feature-branch prefix / dev-main sync /
#                        CHANGELOG self-check verification /
#                        Conventional Commits (title + dev-PR commit messages)
#   release-consistency  version consistency (9 spots: doc/CHANGELOG faces ×6 +
#                        package.json + INSTALLED_VERSION + tag) + CHANGELOG
#                        per-version PR links + dsh platform artifact
#                        (bridge presence & syntax)
#   docs-links           dead links + language switchers (lychee; pull/N and claude.ai excluded)
#
# Historical note: required checks were enabled after 2-3 observed runs (avoid CI issues blocking releases).

name: ci
on:
  pull_request:
  push:
    branches: [main, dev]   # dev: post-merge regression backstop; main: post-release backstop
    tags: ['v*']
  schedule:
    - cron: '17 3 * * 1'   # 每周一 03:17 UTC——集成金丝雀(防安装器/环境漂移静默失效)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 回归: 权威源套件 + 静态健康 / Regression ──
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: '回归自测 / Guard self-test'
        run: node .flow-comet/skills/flow-comet/scripts/guard-self-test.mjs
      - name: '脚本语法 / Script syntax'
        run: |
          for f in $(git ls-files '*.mjs'); do
            node --check "$f" || { echo "语法错误 / syntax error: $f"; exit 1; }
          done
      - name: 'BOM 防线 / BOM guard'
        run: |
          for f in $(git ls-files '*.mjs' '*.yaml' '*.json'); do
            if head -c 3 "$f" | od -An -tx1 | grep -qi 'ef bb bf'; then
              echo "BOM 污染 / BOM in: $f"; exit 1
            fi
          done

  # ── 安装器: 可复现性 + 安装后可用性冒烟 / Installer ──
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: '依赖安装 / Install dependencies'
        run: npm ci
      - name: '锁定文件一致性校验 / Lockfile consistency check'
        run: |
          git diff --exit-code package-lock.json || { echo "依赖漂移 / lockfile drift: package-lock.json changed during npm ci"; exit 1; }
      - name: '安装器可复现性 / Installer reproducibility'
        run: |
          node scripts/prepare-env.mjs --target "$RUNNER_TEMP/installed" >/dev/null
          diff -r --strip-trailing-cr .flow-comet/skills "$RUNNER_TEMP/installed/.claude/skills"             || { echo "安装器漂移 / prepare-env output differs from authoritative source"; exit 1; }
          diff -r --strip-trailing-cr .flow-comet/rules "$RUNNER_TEMP/installed/.claude/rules"             || { echo "rules 与权威源不一致 / prepare-env rules differ from authoritative source"; exit 1; }
      - name: '安装冒烟 / Install smoke test'
        run: |
          node scripts/prepare-env.mjs --target "$RUNNER_TEMP/smoke" >/dev/null
          cd "$RUNNER_TEMP/smoke"
          node .claude/skills/flow-comet/scripts/workflow-state.mjs status | grep -q "no-change"             || { echo "冒烟失败 / smoke failed: status"; exit 1; }
          node .claude/skills/flow-comet/scripts/workflow-state.mjs init smoke-check --init-skip | grep -q "Initialized"             || { echo "冒烟失败 / smoke failed: init"; exit 1; }
          node .claude/skills/flow-comet/scripts/workflow-guard.mjs entry open | grep -q "ENTRY OK"             || { echo "冒烟失败 / smoke failed: entry"; exit 1; }
      - name: '升级路径残留清理 / Upgrade-path stale artifact cleanup'
        run: |
          # 判据(与本地系统测试集 K18 的升级路径清理断言是同一条判据的两份**独立实现**——
          # 改动任一侧都必须同时改另一侧,不共享实现;比对项:① 该删的三类残留 ② 该留的四类
          # 反向探针 ③ 清理输出逐条可核对 ④ 重复运行零清理项):
          #   安装器只覆盖不删除 ⇒ 权威源里已删除 / 改名的文件会在目标副本里永久残留。
          #   本步构造「上一代生成物」夹具并重装,断言残留消失、不该删的仍在(防止误删用户文件)。
          WORK="$RUNNER_TEMP/upgrade-path"
          SK="$WORK/.claude/skills"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          # 预置同名非上游目录:flow-kit 获取走「已存在但非上游克隆,已跳过」路径,本步零网络接触
          mkdir -p "$WORK/flow-kit"
          git -C "$WORK/flow-kit" init -q
          git -C "$WORK/flow-kit" remote add origin https://example.com/not-flow-kit.git
          node scripts/prepare-env.mjs --target "$WORK" --platform claude-code >/dev/null
          # 夹具①:权威源已不存在的三类形态(文件 / 嵌套在镜像子目录的文件 / 目录树 + 空目录)
          mkdir -p "$SK/flow-comet/reference/legacy-subagents" "$SK/flow-comet/reference/legacy-empty"
          touch "$SK/flow-comet/legacy-guidance.md"
          touch "$SK/flow-comet/reference/legacy-notes.md"
          touch "$SK/flow-comet/reference/legacy-subagents/author.md"
          # 夹具②:反向探针(不该删的——用户自有技能 / 命名空间内但权威源整个技能目录不在场 /
          # 无命名空间的生成面 / 项目根用户文件)
          mkdir -p "$SK/my-own-skill" "$SK/flow-comet-fork" "$WORK/.claude/rules"
          touch "$SK/my-own-skill/SKILL.md"
          touch "$SK/flow-comet-fork/SKILL.md"
          touch "$WORK/.claude/rules/user-rule.md"
          touch "$WORK/USER_KEEP.md"
          LOG="$RUNNER_TEMP/upgrade-path.log"
          node scripts/prepare-env.mjs --target "$WORK" --platform claude-code > "$LOG"
          # ① 该删的必删
          for stale in flow-comet/legacy-guidance.md flow-comet/reference/legacy-notes.md flow-comet/reference/legacy-subagents flow-comet/reference/legacy-empty; do
            if [ -e "$SK/$stale" ]; then echo "残留未清理 / stale artifact not removed: $stale"; exit 1; fi
          done
          # ② 不该删的必不删(逐条反向探针)
          for keep in flow-comet/SKILL.md flow-comet/reference/entry-detail.md my-own-skill/SKILL.md flow-comet-fork/SKILL.md; do
            if [ ! -e "$SK/$keep" ]; then echo "误删 / wrongly removed: $keep"; exit 1; fi
          done
          if [ ! -e "$WORK/.claude/rules/user-rule.md" ]; then echo "误删 / wrongly removed: .claude/rules/user-rule.md"; exit 1; fi
          if [ ! -e "$WORK/USER_KEEP.md" ]; then echo "误删 / wrongly removed: USER_KEEP.md"; exit 1; fi
          # ③ 清理输出逐条可核对(人可复核删了什么)
          for name in legacy-guidance.md legacy-notes.md legacy-subagents legacy-empty; do
            grep -q "$name" "$LOG" || { echo "清理输出未逐条打印 / cleanup log missing entry: $name"; exit 1; }
          done
          # ③b 播报标记钉死:④ 的「重跑无清理项」是**负向**断言——标记一旦改名它便恒真;
          # 正向锚在此,标记契约漂移必然红而不是静默失效
          grep -q "镜像清理: 已删除" "$LOG" || { echo "清理播报标记缺失 / cleanup marker missing"; exit 1; }
          # ④ 幂等:重复运行零清理项且零报错
          node scripts/prepare-env.mjs --target "$WORK" --platform claude-code > "$RUNNER_TEMP/upgrade-path-2.log"
          if grep -q "镜像清理" "$RUNNER_TEMP/upgrade-path-2.log"; then
            echo "幂等失配 / not idempotent: cleanup reported on re-run"; exit 1;
          fi
          echo "upgrade-path cleanup OK: stale artifacts removed, keepers preserved, log verifiable, re-run clean"

      - name: '分发面断言 / Distribution surface (pack boundary & bin)'
        run: |
          # shellcheck disable=SC2016
          # 依据:本段内嵌的 node 脚本位于单引号内,其中的 `${...}` 是 JS 模板字面量(JS 插值),
          # 不是 shell 展开——SC2016 在此为误报。指令行须独占一行且不得附加说明文字
          # (shellcheck 会把同一行的其余词当 key=value 解析 → SC1125)。
          # 分发面契约(DESIGN D7/D13、AC-1/D1):files 白名单裁剪出的真实发布内容 + bin 双入口。
          # `npm pack --dry-run` 是只读操作——其文件清单即发布产物。
          #
          # 判据权威定义 = 本地系统测试集的分发面项(K18):assertPublishableManifest /
          # assertPackageBoundary / assertBinContract。本 step 是这三组判据的**等价搬运**——
          # 逐条对齐、同一判据,但不是共享实现:改动任一侧都必须同步另一侧。
          #   ① 清单可发布性:private 缺席 / license 为 MIT / engines.node 为 >=18
          #                                                  ← assertPublishableManifest
          #   ② 包体边界:必含面 / 私有面零命中 / scripts 面两项 /
          #      顶层白名单 fail-closed / 技能树逐文件在场   ← assertPackageBoundary
          #   ③ bin 双入口契约                               ← assertBinContract
          # 同步清单(两份实现没有任何机制能发现彼此已不同步,故把「本侧覆盖了什么」写死在此;
          # 改动任一侧都必须同时改另一侧,并逐条比对——不采信「同源」措辞):
          #   ① 的三条断言(private / license / engines.node);② 的五项子判据(必含面 / 私有面 /
          #   scripts 面 / 顶层白名单 / 技能树逐文件);③ bin 两键指向。
          # license 与 engines.node 正是此前加进 K18 却漏在本 step 同步的两条(服务端门因此比
          # 本地套件弱:删掉 license 或改掉 engines.node 时 required check 仍全绿),现已按同判据补齐。
          # 本 step 另有一条比 K18 更严的锚:flow-comet* 技能目录数恒为 19(白名单裁剪的显式契约)。
          # 尚未搬运:K18 的 init 词元红线(变形/重复词元退 1)——须起真实安装器进程,仍由本地套件覆盖;
          # 完整的系统测试集同样不在 CI 运行(它是本地两级基线中的第二级)。
          npm pack --dry-run --json | node -e '
            const fs = require("fs");
            const path = require("path");
            const entries = JSON.parse(fs.readFileSync(0, "utf8"))[0].files.map((f) => String(f.path).replaceAll("\\", "/"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const problems = [];

            // ① 清单可发布性:private 在场即 npm 拒绝发布(允许缺席或显式非真值);
            // license 与 engines.node 是随发布物固化的公开身份与运行时前提(取值唯一,与 K18 同判据)
            if (pkg.private)
              problems.push(`package.json must not be private (npm refuses to publish): ${JSON.stringify(pkg.private)}`);
            if (pkg.license !== "MIT")
              problems.push(`package.json license must be "MIT" (matches the repository LICENSE): ${JSON.stringify(pkg.license)}`);
            const nodeFloor = pkg.engines ? pkg.engines.node : undefined;
            if (nodeFloor !== ">=18")
              problems.push(`package.json engines.node must be ">=18" (documented runtime requirement): ${JSON.stringify(nodeFloor)}`);

            // ② 必需面:19 个 flow-comet* 技能目录 + rules + 两个随包脚本
            const skills = [...new Set(entries
              .filter((p) => p.startsWith(".flow-comet/skills/"))
              .map((p) => p.split("/")[2]))];
            if (skills.length !== 19 || !skills.every((s) => s.startsWith("flow-comet")))
              problems.push(`skill tree count mismatch (expected 19): ${skills.length} flow-comet* dirs packed`);
            for (const must of [".flow-comet/rules/flow-comet-orchestration.md",
                                "scripts/prepare-env.mjs", "scripts/dsh-bridge.mjs"])
              if (!entries.includes(must)) problems.push(`required entry missing from pack: ${must}`);

            // ③ 私有面:零命中(.githooks/ 文件头明文"主仓私有,不分发"——零配置时实测进包)
            // ④ 本地工具脚本:scripts/ 下只允许两个随包脚本
            const forbidden = [".githooks/", "docs/internal/", ".specs/", "CLAUDE.md", "AGENTS.md", ".github/", "images/"];
            const packedScripts = ["scripts/prepare-env.mjs", "scripts/dsh-bridge.mjs"];
            for (const p of entries) {
              if (forbidden.some((x) => p === x.replace(/\/$/, "") || p.startsWith(x)))
                problems.push(`private entry leaked into pack: ${p}`);
              if (p.startsWith("scripts/") && !packedScripts.includes(p))
                problems.push(`local tool script leaked into pack: ${p}`);
            }

            // ⑤ 顶层白名单 fail-closed:新增顶层条目默认不得进包(未声明即失败,而非静默随包)
            const allowedTop = [".flow-comet", "scripts", "package.json", "README.md", "LICENSE"];
            const unexpectedTop = [...new Set(entries.map((p) => p.split("/")[0]))].filter((t) => !allowedTop.includes(t));
            if (unexpectedTop.length)
              problems.push(`top-level entry outside the allowlist (new top-level dirs must not be packed by default): ${unexpectedTop.join(", ")}`);

            // ⑥ 技能树逐文件在场:权威源磁盘清单 vs 真实产物(漏收 = 安装期炸或平台静默退化)
            const skillRoot = path.join(process.cwd(), ".flow-comet", "skills");
            const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true }).flatMap((e) => {
              const abs = path.join(dir, e.name);
              return e.isDirectory() ? walk(abs) : e.isFile() ? [abs] : [];
            });
            const osJunk = [".DS_Store", "Thumbs.db", "desktop.ini"];
            const onDisk = walk(skillRoot)
              .filter((abs) => !osJunk.includes(path.basename(abs)))
              .map((abs) => ".flow-comet/skills/" + path.relative(skillRoot, abs).replaceAll("\\", "/"))
              .sort();
            const missingSkills = onDisk.filter((p) => !entries.includes(p));
            if (missingSkills.length)
              problems.push(`skill tree files missing from pack: ${missingSkills.slice(0, 5).join(", ")}`);

            // ⑦ bin 双入口契约:两个命令名同指一个文件(AC-3/D1)
            if (!pkg.bin || pkg.bin.fcomet !== "scripts/prepare-env.mjs"
                || pkg.bin["flow-comet"] !== "scripts/prepare-env.mjs")
              problems.push(`bin contract broken: ${JSON.stringify(pkg.bin)}`);

            if (problems.length) { console.error(problems.join("\n")); process.exit(1); }
            console.log(`distribution surface OK: ${entries.length} packed files, ${skills.length} skill dirs, ${onDisk.length} skill tree files verified`);
          '

  # ── 质量: workflow 配置有效性 + 双语镜像对称 / Quality ──
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 'workflow lint / Workflow lint (actionlint)'
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: '双语镜像对称 / Bilingual mirror symmetry'
        run: |
          python - <<'EOF'
          import io, os
          pairs = [('README.md','README-zh.md'),('CONTRIBUTING.md','CONTRIBUTING-zh.md'),
                   ('CHANGELOG.md','CHANGELOG-zh.md'),('docs/INSTALLATION.md','docs/INSTALLATION-zh.md'),
                   ('docs/USAGE.md','docs/USAGE-zh.md'),
                   ('docs/MECHANISM.md','docs/MECHANISM-zh.md'),('docs/TROUBLESHOOTING.md','docs/TROUBLESHOOTING-zh.md'),
                   ('docs/VERSIONS.md','docs/VERSIONS-zh.md'),
                   ('SECURITY.md','SECURITY-zh.md')]
          # CODE_OF_CONDUCT 除外:标准模板(Contributor Covenant)与官方翻译的段落行数天然不对齐(与本地 check-docs-local 一致)
          import re as _re
          def tokens_of(path):
              plines = io.open(path, encoding='utf-8', errors='replace').read().splitlines()
              toks, in_fence = [], False
              for pl in plines:
                  t = pl.strip()
                  if t == '':
                      continue
                  if t.startswith('```'):
                      toks.append(('FENCE', t)); in_fence = not in_fence; continue
                  if in_fence:
                      continue
                  m = _re.match(r'^(#{1,6})\s', t)
                  if m:
                      toks.append(('H' + str(len(m.group(1))), t)); continue
                  if t.startswith('|'):
                      toks.append(('TABLE', t)); continue
                  if t.startswith('<'):
                      toks.append(('HTML', t)); continue
                  if t.startswith('>'):
                      toks.append(('Q', t)); continue
                  if _re.match(r'^([-*+]|\d+\.)\s', t):
                      toks.append(('LIST', t)); continue
                  toks.append(('P', t))
              return len(plines), toks
          # 结构 token 流（2026-09-27 二版）：标题 1~6 级；围栏内整体跳过；表格/列表/引用逐行；
          # 空行不产生 token。已知有意偏差必须声明，且声明带内容模式（被放行的 token 必须匹配），
          # 不是“允许某个偏移量”。
          # 已声明的有意偏差：先在中文侧无条件剔除（必须恰好命中声明条数且匹配内容谓词），
          # 再无条件比较 token 类型序列——不在“已相等”时短路。
          EXEMPT = {'CHANGELOG.md': (1, 'Q', _re.compile(r'^>\s*注：(?=[\s\S]*1\.2\.4)(?=[\s\S]*英文小节标题)'))}
          for en, zh in pairs:
              if not os.path.isfile(en) or not os.path.isfile(zh):
                  raise SystemExit('missing bilingual pair: %s / %s' % (en, zh))
              ne, te = tokens_of(en)
              nz, tz = tokens_of(zh)
              if abs(ne - nz) > 5:
                  raise SystemExit('bilingual line delta > 5: %s %d vs %s %d' % (en, ne, zh, nz))
              ex = EXEMPT.get(en)
              if ex:
                  extra, kind_want, text_re = ex
                  kept, removed = [], 0
                  for tok in tz:
                      if removed < extra and tok[0] == kind_want and text_re.match(tok[1]):
                          removed += 1
                          continue
                      kept.append(tok)
                  if removed != extra:
                      raise SystemExit('declared allowance not found in %s: declared %d, matched %d' % (zh, extra, removed))
                  tz = kept
              if [k for k, _ in te] != [k for k, _ in tz]:
                  raise SystemExit('bilingual structure mismatch: %s %d tokens vs %s %d tokens%s'
                                   % (en, len(te), zh, len(tz), ' (after removing the declared deviation)' if ex else ''))
          print('9 bilingual pairs OK (structural token stream)')
          EOF
      - name: '文档权威单一性 / Documentation single-authority check'
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const CONTRACT = {
            install: { authority: 'docs/INSTALLATION.md', twin: 'docs/INSTALLATION-zh.md', sentinel: ['Verify the installation'], forbidden: ['README.md','docs/USAGE.md','docs/MECHANISM.md','docs/TROUBLESHOOTING.md'], mustLink: ['README.md'] },
            workflow: { authority: 'docs/USAGE.md', twin: 'docs/USAGE-zh.md', sentinel: ['## The 8-node workflow','## User entry points'], forbidden: ['README.md','docs/INSTALLATION.md','docs/MECHANISM.md'], mustLink: ['README.md','docs/MECHANISM.md'] },
            troubleshooting: { authority: 'docs/TROUBLESHOOTING.md', twin: 'docs/TROUBLESHOOTING-zh.md', sentinel: ['## Symptoms'], forbidden: ['README.md','docs/INSTALLATION.md','docs/MECHANISM.md'], mustLink: ['README.md','docs/INSTALLATION.md'] },
            release: { authority: 'docs/VERSIONS.md', twin: 'docs/VERSIONS-zh.md', sentinel: ['Update CHANGELOG','Version record surfaces'], forbidden: ['README.md','CONTRIBUTING.md','docs/MECHANISM.md'], mustLink: ['README.md','CONTRIBUTING.md'] },
            behaviour: { authority: 'docs/MECHANISM.md', twin: 'docs/MECHANISM-zh.md', sentinel: ['## Behaviour contract','## Custom protocols'], forbidden: ['README.md','docs/INSTALLATION.md','docs/USAGE.md'], mustLink: ['README.md','docs/USAGE.md'] },
            contributing: { authority: 'CONTRIBUTING.md', twin: 'CONTRIBUTING-zh.md', sentinel: ['## Borrowing boundary'], forbidden: ['README.md','docs/MECHANISM.md'], mustLink: ['README.md'] },
            history: { authority: 'CHANGELOG.md', twin: 'CHANGELOG-zh.md', sentinel: ['All notable changes to this project'], forbidden: ['README.md','docs/MECHANISM.md','docs/VERSIONS.md'], mustLink: ['README.md'] },
            upstream: { authority: 'README.md', twin: 'README-zh.md', sentinel: ['## Relationship to the upstream project'], forbidden: ['docs/MECHANISM.md','docs/INSTALLATION.md'], mustLink: [] },
            security: { authority: 'SECURITY.md', twin: null, sentinel: [], forbidden: ['README.md'], mustLink: ['README.md'] },
          };
          // Sentinel phrases stay count-free on purpose ('Version record surfaces'): a sentinel that
          // carries a count goes red the moment the count is corrected. Same marker in the local check.
          const COUNTS_SENTINEL = ['badge/version-', 'Version record surfaces'];
          const RELEASE_AUTHORITY = ['docs/VERSIONS.md','docs/VERSIONS-zh.md'];
          const INTERNALS = ['comet-hook-guard.mjs','comet-hook-guard','dsh-bridge.mjs','delegationDepth','reentryAuthorization'];
          const PUBLIC = ['README.md','README-zh.md','CONTRIBUTING.md','CONTRIBUTING-zh.md','CHANGELOG.md','CHANGELOG-zh.md','docs/INSTALLATION.md','docs/INSTALLATION-zh.md','docs/USAGE.md','docs/USAGE-zh.md','docs/MECHANISM.md','docs/MECHANISM-zh.md','docs/TROUBLESHOOTING.md','docs/TROUBLESHOOTING-zh.md','docs/VERSIONS.md','docs/VERSIONS-zh.md'];
          const read = (f) => fs.readFileSync(f, 'utf8');
          const exists = (f) => fs.existsSync(f);
          const path = require('path');
          const targets = (rel) => [...read(rel).matchAll(/\[[^\]]*\]\(\s*(<[^>]*>|[^)\s]+)/g)].map((m) => m[1].replace(/^</, '').replace(/>$/, ''));
          const resolves = (fromRel, href) => {
            if (/^[a-z][a-z0-9+.-]*:/i.test(href) || href.startsWith('//') || href.startsWith('#')) return null;
            const clean = href.split('#')[0].split('?')[0];
            if (!clean) return null;
            return path.posix.normalize(path.posix.join(path.posix.dirname(fromRel), clean));
          };          let failed = 0;
          const check = (name, fn) => { try { fn(); console.log('PASS: ' + name); } catch (e) { console.log('FAIL: ' + name + ' :: ' + e.message); failed++; } };
          for (const topic of Object.keys(CONTRACT)) {
            const c = CONTRACT[topic];
            check('topic ' + topic + ' files present', () => {
              const missing = [c.authority].concat(c.twin ? [c.twin] : []).filter((f) => !exists(f));
              if (missing.length) throw new Error('missing: ' + missing.join(', '));
            });
            check('topic ' + topic + ' sentinel in authority', () => {
              const absent = c.sentinel.filter((x) => !read(c.authority).includes(x));
              if (absent.length) throw new Error('absent: ' + absent.join(' | '));
            });
            check('topic ' + topic + ' sentinel not in forbidden', () => {
              const hits = [];
              for (const f of c.forbidden) { if (!exists(f)) { hits.push(f + ' (missing)'); continue; } for (const x of c.sentinel) if (read(f).includes(x)) hits.push(f + ': ' + x); }
              if (hits.length) throw new Error(hits.join(' | '));
            });
            check('topic ' + topic + ' must_link', () => {
              const bad = [];
              for (const f of c.mustLink) {
                const ok = exists(f) && targets(f).some((h) => resolves(f, h) === c.authority);
                if (!ok) bad.push(f);
              }
              if (bad.length) throw new Error('no link to ' + c.authority + ' from ' + bad.join(', '));
            });
          }
          check('counts sentinel confined to README badge and release authority', () => {
            const bad = [];
            for (const rel of PUBLIC) {
              if (!exists(rel)) continue;
              read(rel).split(/\r?\n/).forEach((line, i) => {
                for (const x of COUNTS_SENTINEL) {
                  if (!line.includes(x)) continue;
                  const badgeLine = /img\.shields\.io/.test(line) && (rel === 'README.md' || rel === 'README-zh.md');
                  if (!RELEASE_AUTHORITY.includes(rel) && !badgeLine) bad.push(rel + ':' + (i + 1));
                }
              });
            }
            if (bad.length) throw new Error(bad.join(', '));
          });
          check('internals not on public surfaces', () => {
            const bad = [];
            for (const rel of PUBLIC) { if (!exists(rel)) continue; for (const x of INTERNALS) if (read(rel).includes(x)) bad.push(rel + ': ' + x); }
            if (bad.length) throw new Error(bad.join(' | '));
          });
          if (failed) { console.log(failed + ' single-authority checks failed'); process.exit(1); }
          console.log('single-authority check passed');
          EOF


  # ── PR 纪律: 分支规范 + 模板完整 + 提交规范 / PR policy ──
  pr-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const isRelease = pr.base.ref === 'main';
            const P = [];

            // Feature-branch prefix (release PR head=dev is exempt)
            // 分支前缀从宽(6 类)、提交/标题从紧(10 类)——刻意设计:分支命名门槛低于提交规范
            if (!isRelease && !/^(feat|fix|docs|chore|hotfix|ci)\//.test(pr.head.ref))
              P.push(`dev PR head branch must carry a feat/fix/docs/chore/hotfix/ci prefix, got ${pr.head.ref}`);

            // dev-main sync (release PR precondition + dev integration gate)
            // Tree-level, main-relative: only files main ADDED that dev lacks mean dev
            // is behind. dev may legitimately lead main with unpublished batch changes
            // (those appear as deletions on the main side and must not count).
            // Files dev deliberately deleted (present in dev's history, removed by an
            // unpublished evolution — e.g. template md → forms migration) are not drift.
            const drift = execSync('git diff --name-only origin/dev origin/main --diff-filter=A')
              .toString().trim().split('\n').filter(Boolean)
              .filter((f) => {
                try { execSync(`git cat-file -e origin/dev:${f}`); return true; } catch { /* dev lacks it */ }
                return !execSync(`git log --oneline origin/dev -- ${f}`).toString().trim();
              })
              .join('\n');
            if (isRelease && drift)
              P.push(`dev lacks ${drift.split('\n').length} file(s) that main added — sync dev before creating the release PR`);
            if (!isRelease && drift)
              P.push(`dev lacks ${drift.split('\n').length} file(s) that main added — sync dev first (missed post-release sync)`);

            // PR template completeness: 5 bilingual sections + 17 checkboxes (deletion = fail)
            const tmpl = fs.readFileSync('.github/PULL_REQUEST_TEMPLATE.md', 'utf8');
            const body = pr.body ?? '';
            const SECTION_PAIRS = [
              ['## 摘要', '## Summary'],
              ['## 改动范围', '## Scope of Changes'],
              ['## 验证', '## Verification'],
              ['## 自查', '## Self-check'],
              ['## 审查注意点', '## Review Notes'],
            ];
            for (const [zh, en] of SECTION_PAIRS)
              if (!body.includes(zh) && !body.includes(en))
                P.push(`PR body missing template section: ${zh} / ${en}`);
            for (const m of tmpl.matchAll(/^- \[ \] (.+)$/gm)) {
              const it = m[1].trim(); // bilingual text e.g. "工作流脚本 / Workflow scripts(...)"
              if (!body.includes(`- [x] ${it}`) && !body.includes(`- [ ] ${it}`))
                P.push(`PR body deleted or omitted checkbox "${it.slice(0, 24)}…" (keep unchecked items)`);
            }

            // CHANGELOG self-check verification: when the PR claims "Behavior changes
            // recorded in CHANGELOG (Unreleased)" (checked), the branch must actually
            // change CHANGELOG relative to its base. Development PRs compare against
            // dev; release PRs (dev -> main) compare against main and pass naturally
            // because the version section is settled on dev before the release.
            if (body.includes('- [x] 行为变化已记入 CHANGELOG（Unreleased）/ Behavior changes recorded in CHANGELOG (Unreleased)')) {
              const base = pr.base.ref === 'main' ? 'origin/main' : 'origin/dev';
              const clDiff = execSync(`git diff --name-only ${base} HEAD -- CHANGELOG.md CHANGELOG-zh.md`).toString().trim();
              if (!clDiff) P.push('self-check claims CHANGELOG updated (Unreleased) but no CHANGELOG diff against base');
            }

            // PR title must follow Conventional Commits (type: subject)
            const titleConv = /^(feat|fix|docs|chore|test|ci|refactor|perf|build|revert)(\([^)]+\))?: .+/;
            if (!titleConv.test(pr.title)) P.push(`PR title not Conventional Commits: "${pr.title}"`);

            // Commit-message convention: Conventional Commits prefix
            // Development PRs only — a release PR (dev -> main) carries the accumulated
            // history of past batches (already reviewed/merged under their own PRs);
            // rewriting history is not an option, so those commits are not re-audited.
            if (!isRelease) {
              const conv = /^(feat|fix|docs|chore|test|ci|refactor|perf|build|revert)(\([^)]+\))?: .+/;
              const commits = await github.rest.pulls.listCommits({
                owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number,
              });
              for (const c of commits.data) {
                const msg = c.commit.message.split('\n')[0];
                if (/^Merge /.test(msg)) continue;
                if (!conv.test(msg)) P.push(`commit message not Conventional Commits: "${msg.slice(0, 60)}"`);
              }
            }

            if (P.length) core.setFailed('Convention violations:\n' + P.join('\n'));

  # ── 发布一致性: 版本 + CHANGELOG(仅发布面) / Release consistency ──
  # Triggered on main push / tag / release PR (base=main). dev is a development
  # intermediate (version/CHANGELOG bumped only at release time) — version checks
  # on dev pushes would be false alarms.
  release-consistency:
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
      || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: '版本全库一致 / Version consistency'
        run: |
          # 版本号可带 prerelease 后缀(如 -rc.1 / -beta-1)。README 徽章用 shields.io 的 -- 转义
          # (单 - 会被 shields 当分隔符截断),故提取后需把 -- 折叠回 -。
          # 对账共九处:README 徽章 ×2 / VERSIONS ×2 / CHANGELOG ×2 / package.json /
          # INSTALLED_VERSION / 发布 tag(见文件头 release-consistency 说明)。
          # badge 提取: version-<value>-<color>.svg → 取 version- 与 .svg 之间的值,
          #           去掉末尾颜色段(最后一个 '-'),再把 --(shields 转义)折叠回 -。
          badgever() {
            grep -oE 'version-[0-9]+\.[0-9]+\.[0-9]+[^ "]*' "$1" | head -1 | \
              sed -E 's/^version-//; s/-[a-zA-Z0-9]+\.svg[^ ]*$//; s/--/-/g'
          }
          vver() { grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?' "$1" | head -1 | tr -d 'v'; }
          cver() { sed -nE 's/^## \[([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)\].*/\1/p' "$1" | head -1; }
          # 包清单版本:package.json 顶层 "version" 键。与既有提取器同为 sed 取值,
          # 不引入 jq 等新工具依赖(ADR-007:全仓唯一第三方依赖是 @clack/prompts)。
          pver() { sed -nE 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' "$1" | head -1; }
          R1=$(badgever README.md)
          R2=$(badgever README-zh.md)
          V1=$(vver docs/VERSIONS.md)
          V2=$(vver docs/VERSIONS-zh.md)
          C1=$(cver CHANGELOG.md)
          C2=$(cver CHANGELOG-zh.md)
          PKGVER=$(pver package.json)
          # 安装版本标识:权威源文件须等于 CHANGELOG 首个版本段(无版本段 = unreleased)
          IV=$(tr -d '\r\n' < .flow-comet/skills/flow-comet/INSTALLED_VERSION)
          IV_EXPECTED=$(cver CHANGELOG.md)
          IV_EXPECTED=${IV_EXPECTED:-unreleased}
          echo "README=$R1/$R2 VERSIONS=$V1/$V2 CHANGELOG=$C1/$C2 PACKAGE=$PKGVER INSTALLED_VERSION=$IV"
          if [ "$R1" = "$R2" ] && [ "$R1" = "$V1" ] && [ "$R1" = "$V2" ] && [ "$R1" = "$C1" ] && [ "$R1" = "$C2" ] && [ "$R1" = "$PKGVER" ]; then
            :
          else
            echo "版本不一致 / version mismatch across docs"; exit 1
          fi
          [ "$IV" = "$IV_EXPECTED" ] || { echo "安装版本标识不一致 / INSTALLED_VERSION($IV) != CHANGELOG 版本($IV_EXPECTED)"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG=${GITHUB_REF#refs/tags/v}
            [ "$TAG" = "$R1" ] || { echo "tag 与文档版本不一致 / tag v$TAG != documented version $R1"; exit 1; }
          fi
      - name: 'dsh 平台产物校验 / dsh platform artifact'
        run: |
          [ -f scripts/dsh-bridge.mjs ] || { echo "dsh 桥接器缺失 / scripts/dsh-bridge.mjs missing"; exit 1; }
          node --check scripts/dsh-bridge.mjs || { echo "dsh 桥接器语法错误 / scripts/dsh-bridge.mjs has syntax errors"; exit 1; }
      - name: 'CHANGELOG 每版本段 PR 链接 / CHANGELOG per-version PR links'
        run: |
          for f in CHANGELOG.md CHANGELOG-zh.md; do
            awk -v file="$f" '
              /^## \[[0-9]/{ver=$2; has[ver]=0}
              /pull\/[0-9]+/{if (ver) has[ver]=1}
              END{for (v in has) if (!has[v] && v !~ /^\[1\.(0|1|2)\.0\]$/) {print file " version section missing PR link: " v; exit 1}}' "$f"
          done

  # ── 死链 + 语言切换器(lychee 覆盖) / Dead links ──
  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: '死链检查 / Dead-link check'
        uses: lycheeverse/lychee-action@v2
        with:
          # Exclude: unmerged-PR 404 false positives / claude.ai anti-bot 403 (Actions IP blocked by Cloudflare; browser works)
          args: --no-progress --exclude 'https?://github\.com/baobaolaodie/flow-comet/pull/|https?://claude\.ai/' README.md README-zh.md CONTRIBUTING.md CONTRIBUTING-zh.md SECURITY.md SECURITY-zh.md CODE_OF_CONDUCT.md CODE_OF_CONDUCT-zh.md CHANGELOG.md CHANGELOG-zh.md docs/ .github/
