# Thin shell around .github/scripts/issue-autoclose.mjs: the trigger shape and the permissions live
# here, the decisions live in the script. The job condition repeats the trigger so an unmerged pull
# request, or one targeting another branch, never gets to the steps at all.
name: issue-autoclose

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  close-referenced:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Close issues referenced by this pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/issue-autoclose.mjs
