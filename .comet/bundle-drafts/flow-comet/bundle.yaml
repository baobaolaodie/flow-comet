apiVersion: comet/v1alpha1
kind: SkillBundle
metadata:
  name: flow-comet
  version: 1.0.0
  description: flow-kit 9 阶段工作流的 workflow-kernel 实现。工件直接读写 .specs/。
  defaultLocale: en
  locales:
    - en
skills:
  - id: flow-comet
    path: skills/flow-comet
    visibility: entry
  - id: flow-comet-open
    path: skills/flow-comet-open
    visibility: internal
  - id: flow-comet-design
    path: skills/flow-comet-design
    visibility: internal
  - id: flow-comet-plan
    path: skills/flow-comet-plan
    visibility: internal
  - id: flow-comet-execute
    path: skills/flow-comet-execute
    visibility: internal
  - id: flow-comet-subagent-execute
    path: skills/flow-comet-subagent-execute
    visibility: internal
  - id: flow-comet-review
    path: skills/flow-comet-review
    visibility: internal
  - id: flow-comet-verify
    path: skills/flow-comet-verify
    visibility: internal
  - id: flow-comet-archive
    path: skills/flow-comet-archive
    visibility: internal
resources:
  rules:
    - id: flow-comet-orchestration
      path: rules/flow-comet-orchestration.md
      mode: always
      required: true
  hooks:
    - id: flow-comet-before-write-guard
      path: hooks/flow-comet-before-write-guard.yaml
    - id: flow-comet-before-tool-guard
      path: hooks/flow-comet-before-tool-guard.yaml
  references:
    - skills/flow-comet/reference/resolved-skills.json
    - skills/flow-comet/reference/workflow-protocol.json
    - skills/flow-comet/reference/decision-points.md
    - skills/flow-comet/reference/recovery.md
    - skills/flow-comet/reference/authoring-lanes.json
    - skills/flow-comet/reference/skill-review.md
    - skills/flow-comet/reference/composition-report.md
    - skills/flow-comet/reference/subagents/script-author.md
  scripts:
    - id: comet-plan
      path: skills/flow-comet/scripts/comet-plan.mjs
      sideEffect: write
      runtime: node
    - id: comet-check
      path: skills/flow-comet/scripts/comet-check.mjs
      sideEffect: read
      runtime: node
    - id: comet-hook-guard
      path: skills/flow-comet/scripts/comet-hook-guard.mjs
      sideEffect: read
      runtime: node
    - id: workflow-state
      path: skills/flow-comet/scripts/workflow-state.mjs
      sideEffect: write
      runtime: node
    - id: workflow-guard
      path: skills/flow-comet/scripts/workflow-guard.mjs
      sideEffect: read
      runtime: node
    - id: workflow-handoff
      path: skills/flow-comet/scripts/workflow-handoff.mjs
      sideEffect: read
      runtime: node
  assets: []
  agents: []
platforms:
  requires:
    - skills
    - scripts
    - rules
    - hooks
    - references
  optional: []
  overrides: []
engine:
  enabled: false
