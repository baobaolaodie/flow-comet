apiVersion: comet/v1alpha1
kind: Skill
metadata:
  name: flow-comet
  version: 1.0.0
  description: Use when the user wants the flow-comet managed workflow for
    flow-kit 9 阶段工作流的 workflow-kernel 实现。工件直接读写 .specs/, explicitly invokes
    /flow-comet, or persisted workflow state identifies one unambiguous active
    run. Route through this entry Skill; do not invoke its internal Node Skills
    directly.
goal:
  statement: flow-kit 9 阶段工作流 + 自动状态管理。工件直接读写 .specs/<change-id>/。
  inputs: []
  outputs:
    - name: result
      description: Generated workflow result
  success:
    - The generated workflow completes according to its workflow protocol
orchestration:
  mode: deterministic
  entry: node-1-open
  steps:
    - id: node-1-open
      action:
        type: invoke_skill
        ref: flow-comet-open
      next: node-2-design
    - id: node-2-design
      action:
        type: invoke_skill
        ref: flow-comet-design
      next: node-3-plan
    - id: node-3-plan
      action:
        type: invoke_skill
        ref: flow-comet-plan
      next: node-4-execute
    - id: node-4-execute
      action:
        type: invoke_skill
        ref: flow-comet-execute
      next: node-5-subagent-execute
    - id: node-5-subagent-execute
      action:
        type: invoke_skill
        ref: flow-comet-subagent-execute
      next: node-6-review
    - id: node-6-review
      action:
        type: invoke_skill
        ref: flow-comet-review
      next: node-7-verify
    - id: node-7-verify
      action:
        type: invoke_skill
        ref: flow-comet-verify
      next: node-8-archive
    - id: node-8-archive
      action:
        type: invoke_skill
        ref: flow-comet-archive
skills:
  - id: flow-comet-open
  - id: flow-comet-design
  - id: flow-comet-plan
  - id: flow-comet-execute
  - id: flow-comet-subagent-execute
  - id: flow-comet-review
  - id: flow-comet-verify
  - id: flow-comet-archive
agents: []
tools: []
